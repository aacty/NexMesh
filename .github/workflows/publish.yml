name: publish

# 发布策略:仅手动触发(打 tag 不再自动发布)。
# 发布前必须由人工在 Actions → publish → Run workflow 确认执行——人工审核即发布闸门。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '包版本(0.MINOR.RUN_NUMBER,与 GITHUB_RUN_NUMBER 一致;留空则自动取 run_number)'
        required: false
        default: ''

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version (0.MINOR.RUN_NUMBER)
        id: version
        run: |
          VERSION="0.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Restore
        run: dotnet restore NexMesh.slnx
        env:
          CI: true
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build
        run: dotnet build NexMesh.slnx -c Release --no-restore
        env:
          CI: true
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Test
        run: dotnet test NexMesh.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack NexMesh.slnx -c Release -o ./packages --no-build
        env:
          CI: true
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: List packages
        run: ls -lh ./packages/*.nupkg

      - name: Push to NuGet.org
        run: |
          PKG_COUNT=$(ls ./packages/*.nupkg | wc -l)
          echo "🚀 Publishing $PKG_COUNT packages (version ${{ steps.version.outputs.version }})..."
          for pkg in ./packages/*.nupkg; do
            name=$(basename "$pkg")
            echo "  → $name"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          done
          echo "✅ $PKG_COUNT packages pushed."
