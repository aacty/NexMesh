name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexMesh.slnx

      - name: Build (zero warnings)
        run: dotnet build NexMesh.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NexMesh.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack NexMesh.slnx -c Release -o ./packages --no-build

      - name: List packages
        run: ls -lh ./packages/*.nupkg

      - name: Push to NuGet.org
        run: |
          echo "Publishing $(ls ./packages/*.nupkg | wc -l) packages to NuGet.org..."
          for pkg in ./packages/*.nupkg; do
            name=$(basename "$pkg")
            echo "  → $name"
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
          echo "Done."
