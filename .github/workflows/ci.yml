name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NEXMESH_TEST_REDIS: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexMesh.slnx

      - name: Build (zero warnings)
        run: dotnet build NexMesh.slnx -c Release --no-restore

      - name: Test (129 tests incl. Redis integration)
        run: dotnet test NexMesh.slnx -c Release --no-build

      - name: Pack (verify packable)
        run: dotnet pack NexMesh.slnx -c Release -o ./packages --no-build

      - name: List artifacts
        run: ls ./packages/*.nupkg
